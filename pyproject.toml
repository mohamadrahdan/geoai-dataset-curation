[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-dataset-curation"
version = "0.1.0"
description = "A reproducible dataset-curation workflow for GeoAI research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Mohammad Rahdan Mofrad" }
]

dependencies = [
  "PyYAML>=6.0",
  "Shapely>=2.1",
  "GeoPandas>=1.0",
  "earthengine-api>=1.7.36",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["src"]